spring.application.name=learn-spring-aop

# Database Setting
spring.datasource.url=jdbc:mysql://localhost:3306/
spring.datasource.username=basic_auth
spring.datasource.password=basic_auth
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Setting
## Automatically alter the table matching with entity
spring.jpa.hibernate.ddl-auto=update
## Show sql to console with format
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
## Automatically set the sql within mySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect